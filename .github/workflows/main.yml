name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A63683: ${{ secrets.A63683 }}
          BC7BAC: ${{ secrets.BC7BAC }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A63683', '')
          meta_b = os.environ.get('BC7BAC', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- b650afda56f1e8327f489731 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- fd42c0d4f5f7a578da8e656377258b085b51 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
